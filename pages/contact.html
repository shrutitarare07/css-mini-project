<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="./../css/style.css" />
    <link rel="stylesheet" href="./../css/contact.css" />
    <link rel="stylesheet" href="./../css/navbar.css" />
    <link rel="stylesheet" href="./../css/footer.css" />

</head>

<body>
    <div class="body-container">

        <div class="navbar">
            <div>
                <a href="./../index.html" style="text-decoration: none; color:#ff8000;">
                    <i class="fa-solid fa-microchip"></i> <span class="brand-name">Simple Electronics</span>
                </a>
            </div>
            <div class="nav-items-container">
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link nav-link-active">Contact</a>
                <a href="products.html" class="nav-link">Products</a>
            </div>
            <div class="navbar-user-icon"><i class="fa-solid fa-circle-user"></i></div>

            <div class="navbar-expand-menu">
                <i class="fa-solid fa-bars "></i>
            </div>
        </div>
  

        <div class="contact-hero-section">
            <img src="./../img/hero-contact.png.png" class="contact-hero-img" />
            <div>
                <h2 class="contact-hero-title">Get in touch with us</h2>

                <p class="contact-hero-subtitle">feel free to contact for any kind of help and query</p>
            </div>
        </div>
        <div class="contact-query-section">
            <form>
                <input type="text" placeholder="Full Name" 
                class="text-input"/>
                <input type="email" placeholder="Email" 
                class="text-input"/>
                <textarea placeholder="Enter Query"
                 class="text-query">

           </textarea>
          <button class="btn btn-active">Submit</button>
         </form>
          
           <img src="./../img/contact/contact-query.png.png" class="contact-query-img"/>
        </div>
       
    
</div>

    <div class="footer">

        <div class="footer-section footer-brand">
            <i class="fa-solid fa-microchip text-lg"></i>
            <p class="text-sm">Simple Electronics</p>
        </div>

        <div class="footer-section">
            <h6>Quick Link</h3>
                <a class="footer-link">About</a>
                <a class="footer-link">Contact</a>
                <a class="footer-link">Product</a>
            </div>

        <div class="footer-section">
            <h6>Social Media</h3>
                <a class="footer-link"><i class="fa-brands fa-instagram"></i>@electronics</a>
                <a class="footer-link"><i class="fa-brands fa-square-facebook"></i>@electronics</a>
                <a class="footer-link"><i class="fa-brands fa-square-twitter"></i>@electronics</a>
          </div>

        <div class="footer-section">
            <h6>Contact Info</h3>
                <a class="footer-link"><i class="fa-solid fa-location-dot"></i>pune</a>
                <a class="footer-link"><i class="fa-solid fa-phone"></i>008655500</a>
                <a class="footer-link"><i class="fa-solid fa-envelope"></i>electronics@gmail.com</a>
        </div>

    </div>
    <script src="https://kit.fontawesome.com/ea1b6ff3d9.js" crossorigin="anonymous"></script>
</body>

</html>
